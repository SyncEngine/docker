server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php;

    client_max_body_size 64M;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

    # container healthcheck endpoint
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # deny access to hidden files (.env, .git, ...), except .well-known
    location ~ /\.(?!well-known) {
        deny all;
    }

    # long-lived caching for static assets
    location ~* \.(css|js|mjs|gif|jpe?g|png|webp|svg|woff2?|ttf|ico)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # must be >= PHP max_execution_time (240s)
        fastcgi_read_timeout 250s;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
